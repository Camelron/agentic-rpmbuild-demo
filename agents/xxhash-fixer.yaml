# Clone of the progenitor agent. The Pod spec must match progenitor-agent.yaml
# except for names, labels, the snapshot annotation, the task ConfigMap, and
# the postStart hook.
apiVersion: v1
kind: ConfigMap
metadata:
  name: xxhash-fixer-task
data:
  task.md: |
    The package xxhash is failing to build. Reproduce the failure with
    `azldev comp build -p xxhash`, iterate on a fix, confirm it with a clean
    rebuild, and push the fix to origin as branch `agent/xxhash-fix`.
---
apiVersion: v1
kind: Pod
metadata:
  name: xxhash-fixer
  labels:
    app.kubernetes.io/name: rpmbuild-agent
    rpmbuild-agent/role: clone
  annotations:
    io.katacontainers.snapshot-name: progenitor-agent
spec:
  runtimeClassName: kata-v2
  nodeSelector:
    snapshot-sync.katacontainers.io/source: "true"
  restartPolicy: Never
  containers:
    - name: agent
      image: agentic-rpmbuild:dev
      imagePullPolicy: Never
      securityContext:
        privileged: true
      env:
        - name: ENTRY_PROMPT
          value: /etc/agent-task/task.md
        - name: COPILOT_GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: copilot-auth
              key: COPILOT_GITHUB_TOKEN
      lifecycle:
        postStart:
          exec:
            command: ["agentctl", "wake"]
      volumeMounts:
        - name: task
          mountPath: /etc/agent-task
          readOnly: true
        - name: copilot-auth
          mountPath: /etc/copilot-auth
          readOnly: true
  volumes:
    - name: task
      configMap:
        name: xxhash-fixer-task
    - name: copilot-auth
      secret:
        secretName: copilot-auth
